<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcuberry</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="title-bar">🍇 Calcuberry 🍇</div>
    <div class="display" id="display">0</div>
    <div class="buttons">
      <!-- Function Overload Row 1 -->
      <button onclick="clearDisplay()">C</button>
      <button onclick="deleteChar()">DEL</button>
      <button onclick="reciprocal()">1/x</button>
      <button onclick="squareRoot()">√</button>

      <!-- Function Overload Row 2 -->
      <button onclick="square()">x²</button>
      <button onclick="appendValue('%')">%</button>
      <button onclick="logBase10()">log</button>
      <button onclick="naturalLog()">ln</button>

      <!-- Function Overload Row 3 -->
      <button onclick="appendValue(Math.PI)">π</button>
      <button onclick="appendValue(Math.E)">e</button>
      <button onclick="appendValue('**')">^</button>
      <button onclick="expOf()">exp</button>

      <!-- Function Overload Row 4 -->
      <button onclick="absVal()">abs</button>
      <button onclick="negate()">+/-</button>
      <button onclick="appendValue('(')">(</button>
      <button onclick="appendValue(')')">)</button>

      <!-- Number Pad -->
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('/')">/</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('*')">*</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('-')">-</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button onclick="calculateResult()">=</button>
      <button onclick="appendValue('+')">+</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
